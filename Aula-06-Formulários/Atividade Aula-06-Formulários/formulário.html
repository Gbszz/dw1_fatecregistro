<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro de Aluno – Curso DSM</title>
</head>
<body>
    <h1>Cadastro de Aluno – DSM</h1>
    <p>Abaixo segue um Formulário contendo os Dados Pessoais e Acadêmicos dos Alunos</p>
    <form action="#" method="POST">
        <fieldset>
            <legend>Dados Pessoais</legend> <br>
            <label for="text">Nome: </label> <br> 
            <input type="text" placeholder="Insira seu nome..." required > <br>
            <label for="email">E-mail:</label> <br>
            <input type="email" required placeholder="Insira seu email..."> <br>
            <label for="date">Data: </label> <br>
            <input type="date" required> <br>
        </fieldset>
    </form>
    <br><br>
    <form action="#" method="POST">
        <fieldset>
            <legend>Dados Acadêmicos</legend> <br>
            <select name="Cursos">
                <option value="1">DSM</option>
                <option value="2">ADS</option>
                <option value="3">Outros</option>
            </select>
            <br> <br>
            <input type="radio" name="Período">Manhã
            <input type="radio" name="Período">Noite
            <br><br>
            <label>Comentários</label> <br>
            <textarea name="Comentários" rows="4" cols="40"></textarea>
            <br>
            <label>Enviar o Formulário</label>
            <button type="submit">Enviar</button>
            <button type="reset">Resetar</button>   
        </fieldset>
    </form>
</body>
</html>
